<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- small background stars -->
  <g fill="#e0e7ff">
    <circle cx="96" cy="104" r="5" opacity="0.8"/>
    <circle cx="420" cy="92" r="4" opacity="0.6"/>
    <circle cx="436" cy="210" r="3" opacity="0.7"/>
    <circle cx="70" cy="230" r="3" opacity="0.5"/>
    <circle cx="160" cy="60" r="3" opacity="0.6"/>
  </g>
  <!-- ticket card sticking out of wallet -->
  <g transform="rotate(-8 256 250)">
    <rect x="150" y="170" width="220" height="140" rx="18" fill="url(#card)"/>
    <rect x="172" y="196" width="90" height="12" rx="6" fill="#eef2ff" opacity="0.9"/>
    <rect x="172" y="220" width="60" height="10" rx="5" fill="#eef2ff" opacity="0.6"/>
  </g>
  <!-- wallet body -->
  <rect x="104" y="240" width="304" height="186" rx="34" fill="url(#wallet)"/>
  <path d="M104 290 h304" stroke="#b45309" stroke-opacity="0.35" stroke-width="6"/>
  <!-- clasp -->
  <rect x="318" y="306" width="110" height="72" rx="22" fill="#fbbf24" stroke="#b45309" stroke-opacity="0.45" stroke-width="6"/>
  <circle cx="352" cy="342" r="12" fill="#1e1b4b"/>
  <!-- the star (Centauri) -->
  <circle cx="300" cy="136" r="78" fill="url(#glow)"/>
  <path d="M300 74 C306 116 318 128 360 136 C318 144 306 156 300 198 C294 156 282 144 240 136 C282 128 294 116 300 74 Z" fill="#fffbeb"/>
</svg>
